name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**

jobs:
  build:
    name: Build using xcodebuild
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run build
        env:
          # The build regenerates the About panel credits, which reads license files from the
          # GitHub API. Unauthenticated requests are rate limited hard enough to make builds flaky.
          LICENSE_PLIST_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
