[settings]
activate_aggressive = true
experimental = true

[plugins]
xcode = "https://github.com/hisaac/mise-xcode.git#v1.0.0"

[env]
_.xcode.version = "26.6.0"
PROJECT_ROOT = "{{ config_root }}"

[tools]
xcbeautify = "latest"
"github:mono0926/LicensePlist" = "3.28.0"

[tasks.open]
run = "xed ."

[tasks.build]
run = "scripts/build.bash"

[tasks.credits]
description = "Regenerate the About panel credits from the resolved dependency graph"
run = "scripts/generate-credits.bash"

[tasks.clean]
run = "rm -rf DerivedData"
